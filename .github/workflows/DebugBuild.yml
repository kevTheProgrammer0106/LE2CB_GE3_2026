name: DebugBuild

on:
push:
branches:
- master

env:
# リポジトリのルートディレクトリを基点としたソリューションファイルのパス
SOLUTION_FILE_PATH: DirectX12Game/DirectX12Game.slnx
# Visual Studio の構成(Debug / Release)
CONFIGURATION: Debug

jobs:
build:
runs-on: windows-2025-vs2026
runs-on: windows-2022

steps: 
- name: checkout 
uses: actions/checkout@v6

name: Add MSBuild to PATH
uses: microsoft/setup-msbuild@v3
with: msbuild-architecture: x64

name: Build
run: | msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}


