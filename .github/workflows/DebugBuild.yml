name: DebugBuild

on:
  push:
    branches:
      - master

env:
  # リポジトリのルートディレクトリを基点としたソリューションファイルのパス
  SOLUTION_FILE_PATH: DirectX12Game.slnx

jobs:
  build:
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Development
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build (${{ matrix.configuration }})
        run: |
          msbuild "${{ env.SOLUTION_FILE_PATH }}" /m /p:Platform=x64 /p:Configuration=${{ matrix.configuration }}
